# ============================================================================
#  PayMesh webhook delivery service (ADR-028, ADR-042)
#
#  A separate deployable beside the monolith, the gateway and provider-sim
#  (ADR-042, PR 7, the first *merchant-facing* leaf). It listens on 8083. It
#  shares the monolith's PostgreSQL cluster but owns exactly one schema
#  (`webhook`), connects as the fenced `webhook_svc` role ADR-038 already
#  created, and cannot see any other schema's tables even by accident.
# ============================================================================

spring:
  application:
    name: paymesh-webhook

  # --- Datasource: the fenced `webhook_svc` role, one schema only ------------
  datasource:
    url: jdbc:postgresql://localhost:5432/paymesh
    # Empty here for the same reason as the monolith's: this file is committed.
    # The dev profile supplies the throwaway `webhook_svc` credential; every
    # other environment supplies its own via SPRING_DATASOURCE_USERNAME/PASSWORD.
    username:
    password:
    hikari:
      # ONE SCHEMA, NOT TEN. Unlike the monolith (which still spans every
      # service's schema in one process), this deployable has no reason to
      # resolve an unqualified table name anywhere but `webhook` -- and
      # `webhook_svc`'s grants (ADR-038 section 4) do not extend past it
      # regardless of what search_path claims. `public` stays for
      # `is_prefixed_id`, which every CHECK constraint in this schema calls.
      connection-init-sql: SET search_path TO webhook, public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          # Same reason as the monolith's and provider-sim's: with entities
          # carrying no explicit schema, ddl-auto=validate must look each mapped
          # table up on its own rather than reading one schema's whole catalogue.
          jdbc_metadata_extraction_strategy: individually

  # --- Flyway: this module's OWN history, in its OWN schema (ADR-042) --------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # `webhook`, not `public`. This is a NEW deployable with no legacy history to
    # stay pinned to -- unlike the monolith, whose Flyway history predates the
    # schema split and must stay in `public` for that reason.
    schemas: webhook
    # ADOPTS THE EXISTING webhook_endpoints/webhook_events/webhook_deliveries and
    # merchant_ref tables (V1) rather than re-running their DDL, and CREATES the
    # platform tables this deployable needs its own copy of (V2), exactly the
    # ADR-041 pattern: against the shared dev database this baselines at V1 and
    # skips it; V2 runs on both a fresh database and the adopted one.
    baseline-on-migrate: true
    baseline-version: "1"

  # --- Kafka (ADR-036, ADR-037): this module's genuinely independent second
  #     consumer of the domain event stream, not merely compatible with it
  #     (ADR-042). Same tuning as the monolith's, for the same reasons -- see
  #     its comments.
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      properties:
        metadata.max.age.ms: 5000

# --- PayMesh security (JWT verification only, ADR-042 section 3) ------------
paymesh:
  security:
    jwt:
      # The SAME shared HS256 secret the monolith signs with and the gateway
      # re-validates at the edge (ADR-040). Declared but deliberately EMPTY, and
      # this application refuses to start without it (JwtConfiguration enforces
      # the 32-byte floor), exactly as the monolith and the gateway do. Supply it
      # as PAYMESH_SECURITY_JWT_SECRET, or run the dev profile.
      secret: ${PAYMESH_SECURITY_JWT_SECRET:}

  # --- Webhook (ADR-028) -------------------------------------------------------
  webhook:
    # THE ONE SECRET THIS CAPABILITY HAS. Every endpoint's signing secret is
    # HMAC-SHA256(master-key, "paymesh.webhook.v1|<endpointId>|<version>" || 0x01), so no secret
    # is ever stored and rotation is an integer bump (ADR-028 section 2). Declared but
    # deliberately EMPTY: this file is committed, and the application refuses to start without it
    # (@NotBlank on WebhookProperties). Supply it as:
    #     PAYMESH_WEBHOOK_MASTER_KEY=<32+ random bytes>
    # or run the dev profile, which supplies a throwaway value.
    master-key:
    # Whether a webhook may be POSTed at a loopback, link-local, RFC1918, CGNAT or IPv6 ULA
    # address. FALSE, and it is a security control rather than a preference: a merchant supplies
    # the URL and this server makes the request, so a permissive value turns every endpoint
    # into an SSRF primitive pointed at the instance metadata service. The dev profile turns it on
    # because dev receivers are on localhost, and WebhookConfiguration honours that ONLY when dev
    # is the single active profile.
    allow-private-addresses: false
    dispatch:
      # true: register the scheduled bean. Off -> the timer does not exist at all
      # (@ConditionalOnProperty), rather than running and doing nothing. On by default, off under
      # dev -- the profile the test suite runs under.
      enabled: true
      interval: 30s
      batch-size: 20
      connect-timeout: 3s
      read-timeout: 5s

  # --- Outbox relay (ADR-016, ADR-025, ADR-037) -------------------------------
  # This module's own outbox and relay, carrying exactly one event type today
  # (webhook.secret_rotated.audited, ADR-042 section 4). Same shape and same
  # defaults as the monolith's relay -- see its comments for why each value is
  # what it is.
  events:
    delivery:
      mode: both
    outbox-relay:
      enabled: true
      interval: 2s
      batch-size: 100
      max-attempts: 25
      # How old the oldest undelivered event may get before the health indicator
      # reports the relay unhealthy (ADR-025, OutboxRelayProperties). Same value
      # the monolith uses.
      backlog-alert-age: 5m

# --- Web server --------------------------------------------------------------
server:
  port: 8083
  shutdown: graceful

# --- Actuator ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
