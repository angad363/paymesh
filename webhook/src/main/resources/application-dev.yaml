# ============================================================================
#  Local development overrides for the webhook service.
#
#  Every @SpringBootTest here carries @ActiveProfiles("dev"); the dispatch timer
#  and the outbox relay are OFF for exactly the reason the monolith's are: a
#  timer POSTing at merchants, or a relay publishing the rotation-audit event,
#  mid-test would mutate rows a test is asserting on. DeliverWebhooksService and
#  PublishOutboxEventsService are plain beans either way, and every test drives
#  dispatch()/publish() directly.
# ============================================================================

spring:
  datasource:
    # The fenced role ADR-038 already created (NOLOGIN by default). A one-time
    # `ALTER ROLE webhook_svc LOGIN PASSWORD '...'` is a README step, same shape
    # as provider-sim's own bootstrap (ADR-041).
    username: webhook_svc
    password: webhook_dev_password

paymesh:
  security:
    jwt:
      # Byte-for-byte the monolith's and the gateway's dev value -- these three
      # MUST agree, or a dev token minted by the monolith stops validating here.
      # DevelopmentSecretGuard-equivalent enforcement lives in the monolith and
      # the gateway; this deployable trusts the same committed value under dev.
      secret: dev-only-insecure-jwt-signing-secret-change-me
  webhook:
    # The master key every merchant's signing secret is derived from (ADR-028 §2). Byte-for-byte
    # the monolith's current dev value -- this module's own DevelopmentSecretGuard refuses it
    # outside the dev profile, same as the monolith's did before extraction.
    master-key: dev-only-insecure-webhook-master-key-change-me
    # THE SSRF GUARD, OFF. Development receivers are on localhost, which is precisely the class of
    # address the guard exists to refuse. Honoured only when dev is the SINGLE active profile --
    # WebhookConfiguration re-checks, so setting this in a deployment achieves nothing.
    allow-private-addresses: true
    dispatch:
      enabled: false
  events:
    delivery:
      mode: in-process
    outbox-relay:
      enabled: false

# --- Actuator (dev only) ------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always
