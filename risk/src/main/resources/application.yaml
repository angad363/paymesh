# ============================================================================
#  PayMesh risk evaluation service (ADR-030, ADR-044)
#
#  A separate deployable beside the monolith, the gateway, provider-sim,
#  webhook and engagement (ADR-044, PR 9, the FIRST *synchronous* extraction):
#  payment's confirm calls this service over HTTP, not in-process. It listens
#  on 8085. It shares the monolith's PostgreSQL cluster but owns exactly one
#  schema (`risk`), connects as the fenced `risk_svc` role ADR-038 already
#  created, and cannot see any other schema's tables even by accident.
# ============================================================================

spring:
  application:
    name: paymesh-risk

  # --- Datasource: the fenced `risk_svc` role, one schema only ---------------
  datasource:
    url: jdbc:postgresql://localhost:5432/paymesh
    # Empty here for the same reason as every other deployable's: this file is
    # committed. The dev profile supplies the throwaway `risk_svc` credential;
    # every other environment supplies its own via
    # SPRING_DATASOURCE_USERNAME/PASSWORD.
    username:
    password:
    hikari:
      # ONE SCHEMA, NOT TEN. `public` stays for `is_prefixed_id`, which every
      # CHECK constraint in this schema calls.
      connection-init-sql: SET search_path TO risk, public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          # Same reason as every other deployable's: with entities carrying no
          # explicit schema, ddl-auto=validate must look each mapped table up
          # on its own rather than reading one schema's whole catalogue.
          jdbc_metadata_extraction_strategy: individually

  # --- Flyway: this module's OWN history, in its OWN schema (ADR-044) --------
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: risk
    # ADOPTS THE EXISTING risk_assessments/denylist_entries tables (V1) rather
    # than re-running their DDL, and CREATES the platform tables this
    # deployable needs its own copy of (V2) plus the new event-fed velocity
    # read model (V3) -- the ADR-041/042/043 pattern unchanged.
    baseline-on-migrate: true
    baseline-version: "1"

  # --- Kafka (ADR-036, ADR-037): this module's genuinely independent consumer
  #     of payment.created, feeding payment_intent_ref (ADR-044 section 4).
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      properties:
        metadata.max.age.ms: 5000

# --- PayMesh security and tuning ---------------------------------------------
paymesh:
  # --- Risk (ADR-030, ADR-044) -------------------------------------------------
  risk:
    # How far back the velocity feature counts a customer's intents. See the
    # monolith's own copy of this comment (RiskProperties) for why only this is
    # tunable and the thresholds are not.
    velocity-window: 1h
    # THE ONE SECRET THIS DEPLOYABLE HAS: the shared key
    # RiskEvaluationKeyFilter checks on every request to
    # /internal/v1/risk-evaluations (ADR-044 section 3). Declared but
    # deliberately EMPTY: this file is committed, and the application refuses
    # to start without it (@NotBlank on RiskProperties). Supply it as
    # PAYMESH_RISK_EVALUATE_KEY, or run the dev profile.
    evaluate-key:

  # --- Outbox relay (ADR-016, ADR-025, ADR-037) -------------------------------
  # This module's own inbox/outbox. Present for platform parity with every
  # other extracted service (ADR-042/043's own instinct); Risk is today a
  # terminal event CONSUMER (payment.created, feeding payment_intent_ref) and
  # produces no event of its own (ADR-030: "Risk decides, Payment acts").
  events:
    delivery:
      mode: both
    outbox-relay:
      enabled: true
      interval: 2s
      batch-size: 100
      max-attempts: 25
      backlog-alert-age: 5m

# --- Web server --------------------------------------------------------------
server:
  port: 8085
  shutdown: graceful

# --- Actuator ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
