# ============================================================================
#  PayMesh backend configuration
#  Single source of truth for app config. Each property is explained inline.
# ============================================================================

spring:
  # Logical name of the application. Shows up in logs, actuator /info, and later
  # in tracing/metrics as the service identifier. Omit -> defaults to blank.
  application:
    name: paymesh-backend

  # --- Datasource: how the app connects to PostgreSQL ------------------------
  # Spring Boot builds a HikariCP connection pool from these. The postgresql
  # driver on the classpath is auto-detected, so we do NOT set driver-class-name
  # -- Boot infers it from the jdbc: URL.
  datasource:
    # JDBC URL: protocol + host + port + database name. Omit -> with spring-data-jpa
    # on the classpath the app fails to start (no datasource to auto-configure).
    url: jdbc:postgresql://localhost:5432/paymesh
    # DB role and its password. Declared but deliberately EMPTY: this file is committed,
    # so anything written here is published. The dev profile supplies throwaway values
    # (application-dev.yaml); every other environment supplies its own through
    # SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD. Left unset -> auth failure
    # when the pool opens, which is the intended outcome of forgetting them.
    username:
    password:

  # --- JPA / Hibernate -------------------------------------------------------
  jpa:
    hibernate:
      # validate: Hibernate NEVER creates or alters tables; at startup it only
      # checks the live schema matches the mapped entities and fails fast on a
      # mismatch. Flyway owns all schema changes, so this is production-safe.
      # With no entities yet there is nothing to validate, so startup passes.
      #   create / create-drop -> wipe & rebuild on every boot (data loss)
      #   update               -> silently mutates prod schema, no history/review
      #   none                 -> also safe, but won't catch entity/schema drift
      ddl-auto: validate
    # false: do NOT dump generated SQL to stdout. Sensible production default
    # (System.out logging is unstructured and slow). Flip to true locally to see
    # queries; pair with format_sql below.
    show-sql: false
    # open-in-view=false: close the persistence context at the end of the service
    # layer instead of holding a DB connection open through view/HTTP rendering.
    # Avoids lazy-loading in controllers and connection-pool exhaustion. Boot
    # defaults this to true (with a warning); we turn it off deliberately.
    open-in-view: false
    properties:
      hibernate:
        # When SQL logging IS on (show-sql: true), pretty-print it across indented
        # lines instead of one long string. No effect while show-sql is false; set
        # now so dev logging is readable later.
        format_sql: true
    # NOTE ON DIALECT: we intentionally do NOT set database-platform / dialect.
    # Hibernate auto-detects PostgreSQLDialect from the live JDBC connection
    # metadata. Hard-coding a versioned dialect is unnecessary in Spring Boot 4
    # and risks drifting from the actual DB version.

  # --- Flyway: version-controlled schema migrations (schema source of truth) --
  flyway:
    # true: run pending migrations automatically at startup. Default when
    # flyway-core is on the classpath; explicit so it's obvious the app owns
    # migration execution. Disabled -> schema is never created/upgraded by the app.
    enabled: true
    # Folder(s) Flyway scans for versioned SQL, e.g. V1__create_merchants.sql.
    # This is the default; stated so the convention is explicit. The folder does
    # not exist yet (no migrations this checkpoint) -> Flyway finds zero scripts
    # and does nothing, which is a valid, green state.
    locations: classpath:db/migration
    # false: refuse to run against a NON-empty database that has no Flyway history,
    # instead of silently "adopting" it. Fail-loud is the safe production default;
    # set true only for a deliberate one-time adoption of a pre-existing schema.
    baseline-on-migrate: false

# --- PayMesh security (Identity and Access) ----------------------------------
paymesh:
  security:
    jwt:
      # HS256 signing key for access tokens. Declared but deliberately EMPTY, and the
      # application refuses to start without it. A committed default would be published
      # in git history, and a deployment that quietly fell back to it would let anyone
      # mint a token for any user at any merchant -- a total authentication bypass, and a
      # silent one. Supply it as:
      #     PAYMESH_SECURITY_JWT_SECRET=<32+ random bytes>
      # (Spring maps that variable onto this property automatically), or run the dev
      # profile, which supplies a throwaway value from application-dev.yaml.
      #
      # Three separate startup checks apply: the property must be present, it must not be
      # application-dev.yaml's public value outside the dev profile (DevelopmentSecretGuard),
      # and it must be at least 32 bytes, because a shorter key weakens every token it would
      # go on to issue. Rotating it invalidates every outstanding access token, which is the
      # intended effect of a compromise. Refresh tokens survive: they are random values in
      # the database, not signed by this key.
      secret:
      # Short by design (SDD 8.6). An access token cannot be revoked before it
      # expires -- nothing checks a denylist -- so its lifetime IS the revocation
      # window. 15 minutes trades a little refresh traffic for that bound.
      access-token-ttl: 15m
      # Long-lived, because it is revocable: it is a row, and logout or detected
      # reuse revokes it immediately. 30 days is how long a user stays signed in
      # without touching the dashboard.
      refresh-token-ttl: 30d
    password:
      # BCrypt cost factor: 2^10 rounds, Spring Security's default and the usual
      # ~100ms-per-verification target on current hardware. Raising it slows every
      # login (and every brute-force attempt) proportionally; the factor is stored
      # inside each hash, so a change re-hashes on next login rather than
      # invalidating existing passwords.
      bcrypt-strength: 10

  # --- Provider callbacks -----------------------------------------------------
  provider:
    # HMAC-SHA256 key for POST /internal/v1/provider-callbacks/{provider}. Declared but
    # deliberately EMPTY, and the application refuses to start without it.
    #
    # THIS IS THE ONLY AUTHENTICATION ON THE ENDPOINT THAT MARKS A PAYMENT SUCCEEDED. There is
    # no bearer token on that route -- a provider has no PayMesh account -- so a published or
    # absent value here means anyone who can reach the port can mark any payment on the platform
    # collected. Supply it as:
    #     PAYMESH_PROVIDER_CALLBACK_SECRET=<32+ random bytes>
    # or run the dev profile, which supplies a throwaway value from application-dev.yaml.
    #
    # Two startup checks apply, the same pair the JWT secret gets: the property must be present
    # (@NotBlank on ProviderProperties), and it must not be application-dev.yaml's public value
    # outside the dev profile (DevelopmentSecretGuard). Rotating it invalidates nothing stored --
    # signatures are verified on arrival, never replayed -- so rotation is a restart with a new
    # value on both sides.
    #
    # One secret, one provider. Per-provider secrets and rotation are deferred.
    callback-secret:

  # --- Outbox relay (ADR-016) -------------------------------------------------
  # outbox_events has been written in-transaction since ADR-010 and, until this
  # existed, NEVER READ. Every row stayed unpublished, so orders.status never
  # reached PAID even when its payment succeeded. This is the job that reads the
  # table, hands each event to the in-process dispatcher, and stamps published_at.
  events:
    outbox-relay:
      # true: register the scheduled bean. Off -> the timer does not exist at all
      # (the bean is @ConditionalOnProperty), rather than running and doing nothing.
      #
      # ON BY DEFAULT, because a relay that is off by default is an outbox with no
      # relay, which is the state this whole thing exists to end. THE dev PROFILE
      # TURNS IT OFF -- that profile is what the test suite runs under, and a timer
      # moving orders to PAID underneath an assertion is a flake generator. See
      # application-dev.yaml. That also means `./mvnw spring-boot:run` has it off:
      # to exercise the Postman "Event delivery" folder, start the app with
      #     PAYMESH_EVENTS_OUTBOX_RELAY_ENABLED=true
      enabled: true
      # How long after one pass FINISHES the next one starts (fixedDelay, not
      # fixedRate -- overlapping passes contend for no benefit).
      #
      # SECONDS, NOT MINUTES, AND THE DIFFERENCE FROM THE SWEEPS BELOW IS THE POINT.
      # A sweep is catch-up work that nobody is watching. This is DELIVERY LATENCY:
      # the gap between a payment succeeding and the merchant's order reading PAID.
      # Five minutes of that would be indistinguishable, to anyone using the API,
      # from the bug this fixes.
      interval: 2s
      # How many unpublished events one pass may take. Bounded so a backlog drains
      # over several passes instead of loading the whole log into memory, and so the
      # number of transactions one pass opens is predictable. Each event is its own
      # transaction (one per consumer, plus one for the published_at stamp).
      batch-size: 100

  # --- Order expiry sweep (ADR-014) -------------------------------------------
  # orders.expires_at is a deadline the merchant sets and, until this sweep existed,
  # nothing ever acted on: the status stayed PENDING forever. This is the job that
  # moves a passed-deadline order to EXPIRED.
  orders:
    expiry-sweep:
      # true: register the scheduled bean. Off -> the timer does not exist at all
      # (the bean is @ConditionalOnProperty), rather than running and doing nothing.
      #
      # ON BY DEFAULT, because a sweeper that is off by default is a sweeper nobody
      # remembers to turn on. THE dev PROFILE TURNS IT OFF -- that profile is what
      # the test suite runs under, and a timer mutating rows underneath a test is a
      # flake generator. See application-dev.yaml.
      enabled: true
      # How long after one sweep FINISHES the next one starts (fixedDelay, not
      # fixedRate -- this is catch-up work and overlapping runs buy nothing).
      #
      # Purely a punctuality knob: it decides how stale an EXPIRED status may be,
      # not which orders qualify. Five minutes means an order is at most five
      # minutes late to expire, which no merchant is measuring.
      interval: 5m
      # How many expirable orders one sweep may take. Bounded so a backlog drains
      # over several runs instead of loading the whole platform into memory, and so
      # the sweep holds a predictable number of short row locks. Each order is its
      # OWN transaction, so this is not a lock-duration multiplier.
      batch-size: 200

  # --- PROCESSING timeout (ADR-015) -------------------------------------------
  # PROCESSING is the one payment-intent state with no local exit: cancel is refused
  # from it because an in-flight attempt may already have succeeded at the provider,
  # so the only way out is a callback -- which may never arrive. A lost callback used
  # to strand the intent and, because an intent holds its order's only live slot, the
  # order with it. This is the exit.
  payments:
    processing-timeout:
      # true: register the scheduled bean. Same on-by-default/off-in-dev reasoning as
      # the order sweep above, and for a sharper reason -- the hole this closes is the
      # largest known one in the payment design.
      enabled: true
      # How often the sweep runs. A punctuality knob only; `age` below is what decides
      # which intents qualify. DO NOT CONFUSE THE TWO.
      interval: 5m
      # HOW LONG AN INTENT MAY SIT IN PROCESSING BEFORE THE PLATFORM GIVES UP ON IT.
      # This is the money-adjacent number in this file and the only one worth arguing
      # about.
      #
      # Timing out writes FAILED, which says "we believe the payment did not happen"
      # with NO EVIDENCE for that belief -- the attempt may have succeeded at the
      # provider, which is exactly why cancel is refused from PROCESSING in the first
      # place. FAILED also releases the order's live-intent slot, so the merchant can
      # create a second intent and, if the belief was wrong, collect twice.
      #
      # So the two directions are NOT symmetrical:
      #   too short -> real payments recorded as failed, and money potentially taken
      #                twice from a customer
      #   too long  -> a stranded order stays stranded a while longer, visibly, with
      #                a manual route out
      # One hour is deliberately far beyond any plausible provider round trip. Lower
      # it only with a reconciliation job in place -- and there is none (SDD 21.4,
      # 24.1). ADR-015 section 4.
      age: 1h
      # How many stranded intents one sweep may take. Each is its own transaction.
      batch-size: 100

    abandoned-intents:
      # Releases the order slot a checkout nobody came back to is holding.
      #
      # WITHOUT THIS, A CLOSED TAB KILLS AN ORDER. uq_payment_intents_live_per_order
      # frees the slot only on FAILED or CANCELLED, and an intent left in
      # REQUIRES_PAYMENT_METHOD is neither -- forever. The merchant then cannot create
      # a second intent, cannot mark the order paid, and cannot reuse their own order
      # reference. The PROCESSING timeout above covers one of the five live states;
      # this covers the two a customer reaches by doing nothing at all.
      enabled: true
      # Punctuality only. `age` decides which intents qualify.
      interval: 5m
      # HOW LONG A CHECKOUT STAYS OPEN. Unlike processing-timeout.age above, this is a
      # PRODUCT decision and not a money one, and the difference is worth being clear
      # about before anyone tunes it.
      #
      # These two states precede a provider being told anything, so nothing can be in
      # flight and cancelling cannot contradict a payment that really happened -- the
      # exact risk that makes PROCESSING uncancellable. The only cost of a short age is
      # a customer who wandered off to find their card and returns to a closed
      # checkout; they start again, and no money is involved either way.
      #
      # Thirty minutes is generous for a card entry and short enough that an order is
      # not held all day by an abandoned tab.
      age: 30m
      # How many abandoned intents one sweep may take. Each is its own transaction.
      batch-size: 100

  # --- Provider simulator (SDD 13, ADR-017) -----------------------------------
  # The fake card/UPI/bank provider the payment flow can be driven against
  # deterministically. It is a module in this deployable, but it is built as though it
  # were not: it writes no PayMesh table, imports no other capability, and its only
  # influence is an HTTP POST of a signed body at /internal/v1/provider-callbacks.
  refund:
    # THE HMAC SECRET FOR /internal/v1/refund-callbacks/**, and its own property rather than a
    # reuse of paymesh.provider.callback-secret even though dev supplies the same value to both.
    #
    # Two names is what makes them separable. The day refunds move to a different provider, or the
    # payment secret is rotated after a leak, this one changes independently and neither route is
    # touched by the other's incident. Sharing one property would make that a code change.
    #
    # No default: DevelopmentSecretGuard refuses the committed dev value outside the dev profile,
    # and a blank one fails startup through @NotBlank rather than accepting unsigned callbacks.
    callback-secret:
  simulator:
    # THE ONLY AUTHENTICATION ON /sim/v1/**. Declared but deliberately EMPTY, and the
    # application refuses to start without it (@NotBlank on SimulatorProperties).
    #
    # This is a third money-moving secret and not a lesser one. POST /sim/v1/payments
    # queues a callback that will mark a PayMesh payment SUCCEEDED, so anyone holding
    # this value can collect any payment on the platform -- the same outcome as forging
    # a callback, reached one step earlier and without signing anything. Supply it as:
    #     PAYMESH_SIMULATOR_API_KEY=<32+ random bytes>
    # or run the dev profile, which supplies a throwaway value from application-dev.yaml.
    #
    # It is deliberately NOT paymesh.provider.callback-secret. One value doing both jobs
    # means one leak does both, and it would make per-provider secrets harder rather than
    # easier -- the single secret would then carry two unrelated meanings and could not be
    # split without changing both directions at once. ADR-017 section 3.1.
    api-key:
    # Where signed callbacks are POSTed. Configurable rather than derived from server.port,
    # because a URL computed from local settings could only ever reach a PayMesh in the same
    # process -- precisely the coupling this module is designed without (SDD 13.6).
    callback-url: http://localhost:8080/internal/v1/provider-callbacks/simulator
    dispatch:
      # true: register the scheduled bean. Off -> the timer does not exist at all (the bean
      # is @ConditionalOnProperty), rather than running and doing nothing.
      #
      # ON BY DEFAULT for the same reason as the sweeps above, and OFF UNDER dev for a
      # sharper one: dev is the profile the whole test suite runs under, and a dispatcher
      # POSTing callbacks at PayMesh while a test asserts on a payment intent is the purest
      # flake generator in this codebase. DispatchProviderCallbacksService is a plain bean
      # that exists either way, and every test calls dispatch() directly.
      enabled: true
      # How long after one pass FINISHES the next begins (fixedDelay, not fixedRate: a slow
      # batch must never be re-entered). Resolved by Spring straight from the environment
      # into @Scheduled -- NOT bound into SimulatorDispatchProperties, because two places to
      # read one value means one of them eventually drifts. Same note as OrderExpiryProperties.
      #
      # Two seconds, not the sweeps' five minutes. This is a test fixture: a callback that
      # takes minutes to arrive makes the module useless for the thing it exists for.
      interval: 2s
      # How many due callbacks one pass may take. Each is its own transaction and its own
      # socket, so this bounds how many calls one pass makes rather than lock duration.
      batch-size: 20
      # How many times one callback may be delivered before it is ABANDONED. A real provider's
      # retry budget is finite; unbounded retries against a 401 would be an infinite loop
      # wearing the costume of resilience.
      max-attempts: 5
      # How far deliver_after is pushed out after a failed attempt. A 404 is expected and
      # retried on purpose -- ADR-012 section 7 says it most likely means the callback
      # overtook the transaction that created the intent it names.
      retry-delay: 5s
      # How long to wait for PayMesh to answer.
      #
      # SHORT ON PURPOSE, and the first number to look at if callbacks start piling up. The
      # HTTP call happens INSIDE the row's transaction, so this is also the longest a hung
      # receiver can hold one row lock and one database connection. The shape that does not
      # have this property is claim-then-send-then-ack with a lease expiry; ADR-017 lists it
      # under accepted costs rather than pretending the cost is not there.
      read-timeout: 2s

# --- Web server --------------------------------------------------------------
server:
  # HTTP port. Omit -> defaults to 8080 anyway; pinned for clarity.
  port: 8080
  # graceful: on SIGTERM, stop accepting new requests but let in-flight ones
  # finish before exit. Matters once real money movement runs through here --
  # prevents cutting off a request mid-transaction on deploy.
  shutdown: graceful

# --- Actuator (operational endpoints) ---------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Only expose health + info over HTTP; everything else stays off to avoid
        # leaking internals. Omit -> Boot exposes only /health by default.
        include:
          - health
          - info
  endpoint:
    health:
      # never: /actuator/health returns just UP/DOWN, no component internals
      # (DB host, disk paths) to unauthenticated callers.
      show-details: never