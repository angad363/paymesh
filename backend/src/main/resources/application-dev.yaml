# ============================================================================
#  Local development overrides: the secrets that application.yaml deliberately
#  leaves empty (so a fresh clone runs with nothing to set up), plus the two
#  background sweepers, which are switched OFF here.
#
#  THE SWEEPERS ARE OFF BECAUSE THIS IS THE PROFILE THE TEST SUITE RUNS UNDER.
#  Every @SpringBootTest in this project carries @ActiveProfiles("dev"), and a
#  timer that mutates orders and payment intents while a test is asserting on
#  them is a flake generator -- one that fails rarely, on someone else's change,
#  in a way nobody can reproduce. Both jobs default to ON in application.yaml,
#  which is where the real default lives; this file is the exception and the only
#  place it is made.
#
#  It follows that `./mvnw spring-boot:run` also runs with them off. To watch
#  either job locally, set the matching environment variable, e.g.
#      PAYMESH_ORDERS_EXPIRY_SWEEP_ENABLED=true
#      PAYMESH_PAYMENTS_PROCESSING_TIMEOUT_ENABLED=true
#  and shorten the interval and age while you are at it -- the production values
#  (5m, 1h) are far too patient to observe by hand.
#
#  The sweep LOGIC is unaffected either way: ExpireOrdersService and
#  TimeOutProcessingPaymentsService are plain beans that exist regardless, so the
#  tests that cover them call sweep() directly and never need a scheduler.
#
#  Everything here is public by definition, which is why the profile is never
#  active by accident. It is switched on explicitly in two places and nowhere
#  else: spring-boot.run.profiles in pom.xml, and @ActiveProfiles("dev") on the
#  tests that boot a context. A deployed environment supplies its own values
#  and must never activate this profile.
# ============================================================================

spring:
  datasource:
    username: paymesh_app
    password: paymesh_dev_password

paymesh:
  security:
    jwt:
      # DevelopmentSecretGuard refuses this exact value unless the dev profile is active,
      # so copying it into a real environment variable fails startup loudly rather than
      # signing production tokens with a key anyone can read in this file.
      secret: dev-only-insecure-jwt-signing-secret-change-me
  provider:
    # Same deal, and it matters more: this key is the ONLY authentication on the endpoint that
    # marks a payment SUCCEEDED. DevelopmentSecretGuard refuses this exact value unless the dev
    # profile is the sole active one, so copying it into a real environment variable fails startup
    # loudly rather than letting anyone forge a callback for any payment.
    callback-secret: dev-only-insecure-provider-callback-secret-change-me
  simulator:
    # Same deal again, and it matters as much as the callback secret rather than less: this key
    # is the only authentication on /sim/v1/**, and POST /sim/v1/payments queues the callback
    # that marks a payment SUCCEEDED. DevelopmentSecretGuard refuses this exact value unless the
    # dev profile is the sole active one.
    api-key: dev-only-insecure-simulator-api-key-change-me
    dispatch:
      # OFF under dev, and this one is not optional. Every @SpringBootTest runs under this
      # profile, and a timer POSTing signed callbacks at PayMesh while a test asserts on a
      # payment intent would mutate the very rows under assertion. To watch it locally:
      #     PAYMESH_SIMULATOR_DISPATCH_ENABLED=true
      # The service is a plain bean, so the tests drive dispatch() directly and never need it.
      enabled: false
  orders:
    expiry-sweep:
      enabled: false
  payments:
    processing-timeout:
      enabled: false
    abandoned-intents:
      # Off under dev for the same reason as the sweep above: this is the profile the
      # test suite runs under, and a timer firing mid-test is a flake nobody can
      # reproduce. The service is a plain class, so tests drive it directly.
      enabled: false
