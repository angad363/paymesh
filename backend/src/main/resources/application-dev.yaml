# ============================================================================
#  Local development overrides: the secrets that application.yaml deliberately
#  leaves empty (so a fresh clone runs with nothing to set up), plus every
#  background job -- the outbox relay and the three sweeps -- switched OFF here.
#
#  THEY ARE OFF BECAUSE THIS IS THE PROFILE THE TEST SUITE RUNS UNDER.
#  Every @SpringBootTest in this project carries @ActiveProfiles("dev"), and a
#  timer that mutates orders and payment intents while a test is asserting on
#  them is a flake generator -- one that fails rarely, on someone else's change,
#  in a way nobody can reproduce. Both jobs default to ON in application.yaml,
#  which is where the real default lives; this file is the exception and the only
#  place it is made.
#
#  It follows that `./mvnw spring-boot:run` also runs with them off. To watch a
#  job locally, set the matching environment variable, e.g.
#      PAYMESH_EVENTS_OUTBOX_RELAY_ENABLED=true
#      PAYMESH_ORDERS_EXPIRY_SWEEP_ENABLED=true
#      PAYMESH_PAYMENTS_PROCESSING_TIMEOUT_ENABLED=true
#  and shorten the sweeps' interval and age while you are at it -- the production
#  values (5m, 1h) are far too patient to observe by hand. The relay's 2s is not.
#
#  THE RELAY IS THE ONE THE POSTMAN COLLECTION NEEDS. Its "Event delivery" folder
#  proves an order reaching PAID, which cannot happen with nothing delivering, so
#  that folder is run against an app started with the first variable above.
#
#  The LOGIC is unaffected either way: PublishOutboxEventsService,
#  ExpireOrdersService and TimeOutProcessingPaymentsService are plain beans that
#  exist regardless, so the tests call publish()/sweep() directly and never need a
#  scheduler.
#
#  Everything here is public by definition, which is why the profile is never
#  active by accident. It is switched on explicitly in two places and nowhere
#  else: spring-boot.run.profiles in pom.xml, and @ActiveProfiles("dev") on the
#  tests that boot a context. A deployed environment supplies its own values
#  and must never activate this profile.
# ============================================================================

spring:
  datasource:
    username: paymesh_app
    password: paymesh_dev_password

paymesh:
  security:
    jwt:
      # DevelopmentSecretGuard refuses this exact value unless the dev profile is active,
      # so copying it into a real environment variable fails startup loudly rather than
      # signing production tokens with a key anyone can read in this file.
      secret: dev-only-insecure-jwt-signing-secret-change-me
  provider:
    # Same deal, and it matters more: this key is the ONLY authentication on the endpoint that
    # marks a payment SUCCEEDED. DevelopmentSecretGuard refuses this exact value unless the dev
    # profile is the sole active one, so copying it into a real environment variable fails startup
    # loudly rather than letting anyone forge a callback for any payment.
    callback-secret: dev-only-insecure-provider-callback-secret-change-me
  events:
    outbox-relay:
      # OFF for the same reason as the sweeps, and more sharply: this one moves an
      # order to PAID, so a tick landing between a test's capture and its assertion
      # would change the very column the test is reading. PublishOutboxEventsService
      # is a plain bean that exists regardless, so the tests drive publish() directly
      # and never wait for a scheduler.
      #
      # It follows that `./mvnw spring-boot:run` has no relay either, and that the
      # Postman "Event delivery" folder needs
      #     PAYMESH_EVENTS_OUTBOX_RELAY_ENABLED=true ./mvnw spring-boot:run
      # to pass. The default interval (2s) is already short enough to watch by hand.
      enabled: false
  refund:
    # Same deal as the provider callback secret above, and it matters as much: this key is the only
    # authentication on the endpoint that marks a refund SUCCEEDED, which posts a ledger reversal
    # and lowers what PayMesh owes the merchant. DevelopmentSecretGuard refuses this exact value
    # unless the dev profile is the sole active one.
    callback-secret: dev-only-insecure-refund-callback-secret-change-me
  refunds:
    processing-timeout:
      # OFF under dev for the same reason as every other sweep: this profile is what the test
      # suite runs under, and a timer failing refunds mid-assertion would change the very rows
      # a test is asserting on.
      enabled: false
  reconciliation:
    # OFF, and this one is not optional. Every @SpringBootTest runs under this profile,
    # and reconciliation MOVES PAYMENTS TO SUCCEEDED and makes the Ledger post -- a tick
    # landing between a test's setup and its assertion would rewrite the rows under
    # assertion and the balance derived from them. To watch it locally:
    #     PAYMESH_RECONCILIATION_ENABLED=true
    # ReconcileProviderDayService is a plain bean, so tests call reconcile(date) directly.
    enabled: false
    # The caller's copy of the simulator's throwaway dev key. Same value, different
    # meaning: paymesh.simulator.api-key is what the provider EXPECTS, this is what the
    # caller SENDS. DevelopmentSecretGuard refuses both outside the dev profile.
    api-key: dev-only-insecure-simulator-api-key-change-me

  simulator:
    # Same deal again, and it matters as much as the callback secret rather than less: this key
    # is the only authentication on /sim/v1/**, and POST /sim/v1/payments queues the callback
    # that marks a payment SUCCEEDED. DevelopmentSecretGuard refuses this exact value unless the
    # dev profile is the sole active one.
    api-key: dev-only-insecure-simulator-api-key-change-me
    dispatch:
      # OFF under dev, and this one is not optional. Every @SpringBootTest runs under this
      # profile, and a timer POSTing signed callbacks at PayMesh while a test asserts on a
      # payment intent would mutate the very rows under assertion. To watch it locally:
      #     PAYMESH_SIMULATOR_DISPATCH_ENABLED=true
      # The service is a plain bean, so the tests drive dispatch() directly and never need it.
      enabled: false
  webhook:
    # The master key every merchant's signing secret is derived from (ADR-028 section 2). One
    # value, every secret -- so a published one lets anyone sign as PayMesh to every merchant at
    # once, and DevelopmentSecretGuard refuses this exact string unless dev is the sole profile.
    # WebhookSecrets separately refuses anything under 32 bytes; this is 44.
    master-key: dev-only-insecure-webhook-master-key-change-me
    # THE SSRF GUARD, OFF. Development receivers are on localhost, which is precisely the class of
    # address the guard exists to refuse. Honoured only when dev is the SINGLE active profile --
    # WebhookConfiguration re-checks, so setting this in a deployment achieves nothing.
    allow-private-addresses: true
    dispatch:
      # OFF under dev, same reason as the simulator's above: the suite runs under this profile and
      # a timer POSTing at merchants would mutate the delivery rows a test is asserting on.
      # DeliverWebhooksService is a plain bean, so tests call dispatch() directly.
      enabled: false
  notification:
    dispatch:
      # OFF under dev, same reason: the suite runs under this profile and a timer flipping
      # notification rows to SENT would mutate the rows a test asserts on.
      # SendPendingNotificationsService is a plain bean, so tests call dispatch() directly.
      enabled: false
  reporting:
    export:
      # OFF under dev, same reason: the suite runs under this profile and a timer flipping an
      # export from PENDING to COMPLETED would mutate the row a test is asserting on.
      # GenerateReportExportsService is a plain bean, so tests call generate() directly.
      enabled: false
  # OFF, and this one is not optional. Every @SpringBootTest runs under this
  # profile and the release job MOVES A MERCHANT'S BALANCE between two accounts
  # -- a tick landing between a test's setup and its assertion rewrites the very
  # figure under assertion, and the ledger tests assert exact balances.
  # ReleaseAvailableFundsService is a plain bean, so tests call release()
  # directly and never wait for a timer.
  ledger:
    release:
      enabled: false

  settlement:
    # OFF, and for the same reason as the release job: this one cuts batches and
    # POSTs payouts at the simulator, so a tick landing mid-test rewrites the
    # balance under assertion AND queues callbacks nobody asked for. Both
    # services are plain beans, so tests call them directly.
    sweep:
      enabled: false
    payouts:
      url: http://localhost:8080/sim/v1/payouts
      # The same two values the simulator and the payment callback route use in
      # dev, spelled out rather than referenced -- these are separate properties
      # that happen to agree today, and a YAML anchor would hide that.
      api-key: dev-only-insecure-simulator-api-key-change-me
      callback-secret: dev-only-insecure-provider-callback-secret-change-me

  orders:
    expiry-sweep:
      enabled: false
  payments:
    processing-timeout:
      enabled: false
    abandoned-intents:
      # Off under dev for the same reason as the sweep above: this is the profile the
      # test suite runs under, and a timer firing mid-test is a flake nobody can
      # reproduce. The service is a plain class, so tests drive it directly.
      enabled: false

# --- Actuator (dev only) ------------------------------------------------------
# THE PRODUCTION DEFAULT IS show-details: never, and it stays that way. This
# overrides it for development ONLY, and the reason is ADR-025: the outbox
# backlog indicator's whole value is two numbers -- how old the oldest
# undelivered event is, and how many the relay has given up on -- and with
# details hidden, /actuator/health reports a bare UP/DOWN and a developer cannot
# see either. An alert nobody can read the detail of is half an alert.
#
# Safe here because the override lives in the dev profile document and applies
# nowhere else. Note what does NOT protect it: DevelopmentSecretGuard refuses
# COMMITTED SECRET VALUES outside a dev-only profile set -- it does not stop
# `dev` being activated alongside another profile with real secrets supplied,
# and in that combination these details would be exposed. Activating dev in a
# deployment is the mistake; this is one of the things it would cost.
management:
  endpoint:
    health:
      show-details: always
