# ============================================================================
#  PayMesh settlement service (ADR-047)
#
#  A separate deployable beside the monolith, the gateway, provider-sim,
#  webhook, engagement, risk, identity and merchant: merchant settlement
#  batches, payouts and the payout callback, moved out. Listens on 8088. Shares
#  the monolith's PostgreSQL cluster but owns exactly one schema (`settlement`)
#  and connects as the fenced `settlement_svc` role ADR-038 already created.
#
#  It never posts journals: it reads the ledger's available contributions over
#  HTTP and emits settlement.batch_cut / payout.* events the ledger consumes
#  (ADR-047 sections 1 and 4).
#
#  EXCLUSIVE OWNERSHIP OF THE CUT (ADR-047 section 2): exactly ONE process has
#  paymesh.settlement.sweep.enabled=true. Here it is true; the monolith's is
#  false in the same cutover step. Two sweepers would cut a balance twice.
# ============================================================================

spring:
  application:
    name: paymesh-settlement

  datasource:
    url: jdbc:postgresql://localhost:5432/paymesh
    # Empty: this file is committed. The dev profile supplies the throwaway
    # `settlement_svc` credential; other environments use
    # SPRING_DATASOURCE_USERNAME/PASSWORD.
    username:
    password:
    hikari:
      # `public` stays for `is_prefixed_id`, which every CHECK here calls.
      connection-init-sql: SET search_path TO settlement, public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          jdbc_metadata_extraction_strategy: individually

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: settlement
    # ADOPTS the existing settlement_configs/settlement_batches/settlement_items/
    # payouts/payout_callbacks tables (V1); V2 creates the platform tables.
    baseline-on-migrate: true
    baseline-version: "1"

  kafka:
    # ADR-052: Micrometer Observation puts/reads W3C traceparent in Kafka record HEADERS
    # (body and EventEnvelope untouched). Code in KafkaEventPublisher/Listener is unchanged.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      properties:
        metadata.max.age.ms: 5000

paymesh:
  settlement:
    default-holding-period: 7d
    sweep:
      # THE SINGLE SWITCH of exclusive ownership of the cut (ADR-047 section 2).
      enabled: true
      interval: 1h
      initial-delay: 10m
    payouts:
      interval: 5m
      initial-delay: 11m
      url: http://localhost:8082/sim/v1/payouts
      api-key: ${PAYMESH_SIMULATOR_API_KEY:}
      callback-secret: ${PAYMESH_PROVIDER_CALLBACK_SECRET:}
      connect-timeout: 2s
      read-timeout: 5s
    cut-batch-size: 50
    payout-retry-delay: 15m
    answer-timeout: 1h
    ledger:
      # Only `http` exists here (the in-process adapter needs the monolith's ledger classes).
      mode: http
      # The gateway (ADR-050 section 6): the one place that decides which process serves the ledger read.
      url: http://localhost:8081
      key: ${PAYMESH_LEDGER_READ_KEY:}
      connect-timeout: 2s
      read-timeout: 3s

  security:
    jwt:
      # Verify-only here (identity mints). The SAME shared HS256 secret the
      # gateway and every other deployable verifies with (ADR-040). Empty by
      # default; supply PAYMESH_SECURITY_JWT_SECRET or run the dev profile.
      secret: ${PAYMESH_SECURITY_JWT_SECRET:}

  events:
    delivery:
      mode: both
    outbox-relay:
      enabled: true
      interval: 2s
      batch-size: 100
      max-attempts: 25
      backlog-alert-age: 5m

server:
  port: 8088
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never
  # ADR-052: tracing + metrics, OTLP -> one OpenTelemetry Collector. Non-authoritative
  # (invariant 9): spans go through the SDK's async BatchSpanProcessor and metrics through
  # a background publisher thread, so a down collector only logs a warning -- it never
  # blocks, slows or fails a request, and the service starts normally without it.
  tracing:
    sampling:
      probability: 1.0 # dev: sample everything; lower for a real environment
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
          timeout: 2s
          connect-timeout: 1s
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 15s
        base-time-unit: seconds # match the _seconds_ Prometheus convention the dashboard queries
        connect-timeout: 1s
        read-timeout: 2s
